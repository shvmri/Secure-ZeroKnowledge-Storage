<html lang="en">
<head>

  <style>
    :root {
      --primary: #1a73e8;           /* Standard Blue */
      --primary-hover: #1557b0;     /* Darker Blue for hover */
      --sidebar-bg: #e8f0fe;        /* Very light blue sidebar */
      --content-bg: #f8faff;        /* Crisp blue-tinted white background */
      --border-color: #d2e3fc;      /* Soft blue borders 
      /* Fonts forced to Black */
      --text-main: #000000;         /* Pure black for headings/main text */
      --text-sub: #000000;          /* Pure black for subtext/dates */
      --danger: #d93025;
      --success: #188038;
    }

    body {
      font-family: 'Montserrat', sans-serif;      background: var(--content-bg);
      margin: 0;
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .sidebar {
      width: 280px;
      background: var(--sidebar-bg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      font-size: 24px;
      font-weight: 600;
      color: #000000;
      margin-bottom: 30px;
    }

    .nav-menu {
      flex-grow: 1;
    }

    .nav-menu button {
      width: 100%;
      background: transparent;
      border: none;
      padding: 12px 18px;
      text-align: left;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-sub);
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 8px;
    }

    .nav-menu button.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
    }

    .nav-menu button:hover:not(.active) {
      background: #d0e1fd;    
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
      margin-top: auto;
    }

    .btn-logout-sidebar {
      width: 100%;
      background: #fff0f0;
      border: 1px solid #ffdada;
      padding: 12px;
      border-radius: 10px;
      color: var(--danger);
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-logout-sidebar:hover {
      background: var(--danger);
      color: white;
    }

    .btn-settings-sidebar {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: transparent;
      border: 1px solid var(--border-color); 
      color: var(--text-main);
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .btn-settings-sidebar:hover {
      background: var(--primary);
      color: white !important;
      border-color: var(--primary);
    }

    .btn-settings-sidebar.active {
      background: var(--primary);
      color: white;
    }

    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background: var(--content-bg);
    }

    .header-bar {
      height: 80px; /* Made slightly taller */
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      /* Line removed here as requested */
    }

    #greeting {
      font-size: 20px; /* Larger */
      font-weight: 600;
      color: #000000;
    }

    #keyStatus {
      margin-left: auto;
      font-size: 18px; /* Larger */
      font-weight: 600;
    }

    .content-body {
      padding: 10px 40px 40px 40px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .upload-card {
      background: #ffffff;
      border: 2px dashed var(--border-color);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      margin-bottom: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .primary-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .primary-btn:hover { 
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }

    .file-card {
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      transition: 0.3s;
      background: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .file-card:hover {
      box-shadow: 0 10px 25px rgba(108, 92, 231, 0.1);
      transform: translateY(-4px);
    }

    .file-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }

    .file-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      white-space: nowrap;      /* Keeps text on one line */
      overflow: hidden;         /* Hides the text that goes outside the card */
      text-overflow: ellipsis;  /* Adds "..." to the end of long names */
    }

    .file-date {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 20px;
    }

    .file-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .file-actions button {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    .btn-download { color: var(--primary); border-color: #d1c9ff !important; }
    .btn-download:hover { background: var(--primary); color: white; }

    .btn-delete { color: var(--danger); border-color: #ffdada !important; }
    .btn-delete:hover { background: var(--danger); color: white; }

    .auth-container {
      position: fixed;
      inset: 0;
      background: var(--sidebar-bg);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      position: relative;
      width: 400px;
      padding: 40px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(108, 92, 231, 0.1);
    }

    .auth-card input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .auth-logo {
      position: absolute;
      top: 20px;
      right: 20px;
      color: var(--primary);
    }

    .auth-card input:focus {
      outline: 2px solid var(--primary);
      border-color: transparent;
    }

    .message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      z-index: 1000;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .success { background: var(--success); }
    .error { background: var(--danger); }

    .no-files { color: var(--text-sub); font-style: italic; grid-column: 1/-1; text-align: center; padding: 60px; }

  .integrity-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #e8f5e9;
      color: #2e7d32;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
      border: 1px solid #c8e6c9;
  }

  .integrity-icon {
      width: 12px;

  }

  .info-icon-trigger:hover {

    border-color: #2196F3 !important;
    background: rgba(33, 150, 243, 0.1);

  }

  @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(198, 40, 40, 0); }
      100% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0); }
  }


  </style>
</head>

<script type="module">
    import firebaseConfig from './firebase-config.js';

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    window.auth = firebase.auth();
    window.storage = firebase.storage();
    window.db = firebase.firestore();
    
    const messageDiv = document.getElementById('message');
    const greetingDiv = document.getElementById('greeting');
    const settingsEmail = document.getElementById('settingsEmail');

    window.showMessage = function(text, type='success') {
      if (!messageDiv) return;
      messageDiv.innerText = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      setTimeout(() => messageDiv.style.display = 'none', 4000);
    };

    window.calculateHash = async (file) => {
        const arrayBuffer = await file.arrayBuffer();
        const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
        return Array.from(new Uint8Array(hashBuffer))
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('');
    };

    function showMessage(text, type='success') {
      messageDiv.innerText = text;
      messageDiv.className = `message ${type}`;
      messageDiv.style.display = 'block';
      setTimeout(() => messageDiv.style.display = 'none', 4000);
    }

    auth.onAuthStateChanged(async user => {
      if (user) {
        await user.reload();

        if (!user.emailVerified) {
          document.getElementById('auth').innerHTML = `
            <div class="auth-card" style="text-align:center">
              <h2 style="color:var(--primary)">Verify Your Email</h2>
              <p style="color:var(--text-sub)">Your email <b>${user.email}</b> is not verified.</p>
              <button class="primary-btn" onclick="checkVerification()">I have verified my email</button>
              <button class="primary-btn" style="background:var(--danger); margin-top:10px" onclick="logout()">Logout</button>
            </div>
          `;
          updateKeyStatus("🔒 Offline", { text: "#636e72" });
          return;
        }

        document.getElementById('auth').style.display = 'none';
        greetingDiv.innerHTML = `👋 Welcome, <span style="color:var(--primary)">${user.email}</span>`;
        settingsEmail.innerText = user.email;

        generateAndStoreRSAKeys(); // PKI INIT 
        hideSettings();
        loadFiles();
      } else {
        document.getElementById('auth').style.display = 'flex';
        greetingDiv.innerText = '';
        clearFields();
        updateKeyStatus("🔒 Offline", { text: "#636e72" });
      }
    });


    function toggleAuth(view) {
      document.getElementById('loginView').style.display = view === 'login' ? 'block' : 'none';
      document.getElementById('registerView').style.display = view === 'register' ? 'block' : 'none';
    }

    async function login() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
          const userCredential = await auth.signInWithEmailAndPassword(email, password);

          if (!userCredential.user.emailVerified) {
              await logForensicEvent("USER_LOGIN_FAILURE", { email: email, reason: "Email not verified" });
              showMessage("Please verify your email first.", "error");
              auth.signOut();
              return;
          }

          await logForensicEvent("USER_LOGIN_SUCCESS", { email: email });
          showMessage("Welcome back!");
          showMyDrive();

      } catch (error) {
          // Log the failure with the email provided in the input field
          await logForensicEvent("USER_LOGIN_FAILURE", { 
              email: email, 
              reason: error.message,
              errorCode: error.code 
          });
          showMessage(error.message, "error");
      }
  }

    async function register() {
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        await userCredential.user.sendEmailVerification();
        document.getElementById('auth').innerHTML = `
          <div class="auth-card" style="text-align:center">
            <h2 style="color:var(--primary)">Check Your Inbox</h2>
            <p style="color:var(--text-sub)">Verification link sent to <b>${email}</b>.</p>
            <button class="primary-btn" onclick="checkVerification()">I have verified my email</button>
          </div>
        `;
      } catch (error) {
        showMessage(error.message, 'error');
      }
    }

    async function checkVerification() {
      const user = auth.currentUser;
      await user.reload();
      if (user.emailVerified) {
        location.reload(); 
      } else {
        showMessage("Email not verified yet.", "error");
      }
    }

    function logout() { auth.signOut(); }

    async function deleteAccount() {
      if (!confirm("Are you sure? This deletes everything permanently.")) return;
      const user = auth.currentUser;
      try {
        const listRef = storage.ref(`${user.uid}/`);
        const res = await listRef.listAll();
        for (const itemRef of res.items) { await itemRef.delete(); }
        await user.delete();
        showMessage("Account deleted.");
      } catch (error) {
        showMessage("Please re-login to delete account.", "error");
      }
    }

    async function generateAESKey() {
      return await crypto.subtle.generateKey(
        { name: "AES-GCM", length: 256 }, 
        true, 
        ["encrypt", "decrypt"]);
    }

    async function encryptFile(file, aesKey) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const buffer = await file.arrayBuffer();
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, buffer);
      return { encryptedBlob: new Blob([encrypted]), iv: Array.from(iv) };
    }

     async function uploadFile() {
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) return showMessage("Select a file first", "error");

      const user = auth.currentUser;
      if (!user) return showMessage("Please log in first", "error");

      const statusContainer = document.getElementById("statusContainer");
      const hashDisplay = document.getElementById("hashDisplay");

      try {
          showMessage("Hashing and Encrypting...");

          // 1. Generate SHA-256 Hash
          const fileBuffer = await file.arrayBuffer();
          const hashResult = await generateFileHash(fileBuffer);
          if (!hashResult) throw new Error("Integrity Hash generation failed.");

          if (statusContainer && hashDisplay) {
              statusContainer.style.display = "block";
              hashDisplay.innerHTML = `<strong>Forensic Hash (SHA-256):</strong><br><span style="color:var(--primary)">${hashResult}</span>`;
          }

          // 2 & 3. AES Key and File Encryption
          const aesKey = await generateAESKey();
          const encrypted = await encryptFile(file, aesKey);

          // 4. Retrieve Public Key
          const userDoc = await db.collection("users").doc(user.uid).get();
          if (!userDoc.exists || !userDoc.data().publicKey) {
              throw new Error("User encryption keys not found. Please refresh.");
          }
          
          // Ensure importPublicKey uses { name: "RSA-OAEP", hash: "SHA-256" }
          const publicKey = await importPublicKey(userDoc.data().publicKey);

          // 5. Wrap AES Key with RSA
          // This is the "Locker". It must use RSA-OAEP.
          const encryptedAESKeyBuffer = await window.crypto.subtle.encrypt(
              { name: "RSA-OAEP" },
              publicKey,
              await window.crypto.subtle.exportKey("raw", aesKey)
          );
          
          if (!encryptedAESKeyBuffer || encryptedAESKeyBuffer.byteLength === 0) {
              throw new Error("RSA Encryption failed: Buffer is empty.");
          }

          // DIRECT BINARY-TO-BASE64 CONVERSION
          // Using a loop ensures the string is "clean" and exactly 256 bytes for a 2048-bit key.
          const encryptedAESKeyBase64 = btoa(
              String.fromCharCode.apply(null, new Uint8Array(encryptedAESKeyBuffer))
          );

          // 6 & 7. Upload to Storage
          const storagePath = `${user.uid}/${Date.now()}_${file.name}.enc`;
          await storage.ref(storagePath).put(encrypted.encryptedBlob);

          // 8. Commit Metadata to Firestore
          const finalMetadata = {
              ownerId: user.uid,
              fileName: file.name + ".enc",

    function formatUploadDate(dateString) {
      const date = new Date(dateString);
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      let hours = date.getHours();
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      return `${day}/${month}/${year} ${hours}:${minutes} ${ampm}`;
    }

    async function importPublicKey(base64Key) {
      try {
        // 0. Initial Safety Check
        if (!base64Key) {
          throw new Error("Public key string is empty or undefined.");
        }

        // 1. Scrub the string of any headers, footers, or whitespace
        const cleanKey = base64Key.replace(/-----BEGIN.*?-----|-----END.*?-----|\s/g, "");
        
        // 2. Convert the clean Base64 to a binary ArrayBuffer
        const binaryKey = Uint8Array.from(atob(cleanKey), c => c.charCodeAt(0));
        
        // 3. Import into the Web Crypto API
        return await window.crypto.subtle.importKey(
          "spki",
          binaryKey,
          { 
            name: "RSA-OAEP", 
            hash: "SHA-256" 
          },
          true,
          ["encrypt"]
        );
      } catch (err) {
        console.error("Critical error in importPublicKey:", err);
        // This error will be caught by the shareFile catch block
        throw new Error("The recipient's public key is incorrectly formatted or missing.");
      }
    }

    async function encryptAESKeyWithRSA(aesKey, publicKey) {
      const rawKey = await crypto.subtle.exportKey("raw", aesKey);
      const encryptedKey = await crypto.subtle.encrypt(
        { name: "RSA-OAEP" },
        publicKey,
        rawKey
      );
      return btoa(String.fromCharCode(...new Uint8Array(encryptedKey)));
    }

    async function generateAndStoreRSAKeys() {
      const user = auth.currentUser;
      if (!user) return;

      const userRef = db.collection("users").doc(user.uid);
      const doc = await userRef.get();
      const userData = doc.exists ? doc.data() : null;

      /* -----------------------------------------------------------
        SCENARIO 1: NEW COMPUTER / RESTORE KEYS
        (Encrypted backup exists in cloud, but LocalStorage is empty)
        ----------------------------------------------------------- */
      if (userData && userData.encryptedPrivKey && !localStorage.getItem("privateKey")) {
        console.log("Cloud backup found. Attempting to restore to this device...");
        
        const masterPass = prompt("New Device Detected! 🔐\nEnter your Master Password to unlock your secure vault on this computer:");
        
        if (masterPass) {

            await restorePrivateKeyFromCloud(masterPass);
            updateKeyStatus("🔓 RSA Keys Restored", { text: "var(--success)" });
            console.log("Keys successfully synced to new device.");
            return;
          } catch (err) {
            alert("Failed to unlock: " + err.message);
            updateKeyStatus("❌ Unlock Failed", { text: "#ff4d4d" });
            return;
          }
        } else {
          updateKeyStatus("🔑 Unlock Required", { text: "#ffca28" });
          return;
        }
      }

      /* -----------------------------------------------------------
        SCENARIO 2: ALREADY SET UP
        (Keys exist both in LocalStorage and Firestore)
        ----------------------------------------------------------- */
      if (userData && userData.publicKey && localStorage.getItem("privateKey")) {
        console.log("Public key already exists in Firestore and Private key is local.");
        updateKeyStatus("🔓 RSA Keys Ready", { text: "var(--success)" });
        return;
      }

      /* -----------------------------------------------------------
        SCENARIO 3: FRESH START / NEW USER
        (Generate everything from scratch)
        ----------------------------------------------------------- */
      const newMasterPass = prompt("Set a Master Password for your Secure Vault.\n\nIMPORTANT: This password will be used to sync your account to other computers. If you lose it, your files cannot be recovered!");
      
      if (!newMasterPass) {
        alert("Master Password is required to initialize the secure vault.");
        return;
      }

      updateKeyStatus("⏳ Generating RSA keys...", { text: "var(--primary)" });
      console.log("Generating fresh RSA key pair...");

      const keyPair = await window.crypto.subtle.generateKey(
        {
          name: "RSA-OAEP",
          modulusLength: 2048,
          publicExponent: new Uint8Array([1, 0, 1]),
          hash: "SHA-256"
        },
        true,
        ["encrypt", "decrypt"]
      );

      const publicKey = await window.crypto.subtle.exportKey("spki", keyPair.publicKey);
      const privateKey = await window.crypto.subtle.exportKey("pkcs8", keyPair.privateKey);

      const publicKeyBase64 = btoa(String.fromCharCode(...new Uint8Array(publicKey)));
      const privateKeyBase64 = btoa(String.fromCharCode(...new Uint8Array(privateKey)));

      // 1. Save Private Key locally for immediate use
      localStorage.setItem("privateKey", privateKeyBase64);

      // 2. Save Public Key to Firestore (so others can share with you)
      await userRef.set({
        email: user.email,
        publicKey: publicKeyBase64,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      // 3. Backup Private Key to Cloud (Encrypted with Password)
      try {
        await backupPrivateKeyToCloud(privateKeyBase64, newMasterPass);
        console.log("RSA keys generated and encrypted backup saved to Firestore");
        updateKeyStatus("🔓 RSA Keys Ready", { text: "var(--success)" });
      } catch (backupErr) {
        console.error("Backup failed:", backupErr);
        showMessage("Vault created locally, but cloud sync failed.", "error");
      }
    }


      async function shareFile(fileId, fileName) { 
        const recipientEmail = prompt("Enter recipient's email address:");
        if (!recipientEmail) return;
        const sender = auth.currentUser;

        try {
            console.log("--- STARTING SHARE PROCESS ---");

            // 1. Recipient Check
            const snapshot = await db.collection("users").where("email", "==", recipientEmail).get();
            if (snapshot.empty) throw new Error("Recipient has no keys in system.");
            
            const recipientData = snapshot.docs[0].data();
            const recipientPublicKeyBase64 = recipientData.publicKey;
            const recipientUid = snapshot.docs[0].id;
            console.log("Checkpoint 1: Recipient key found.");

            // 2. File Check
            const fileDoc = await db.collection("files").doc(fileId).get();
            if (!fileDoc.exists) throw new Error("File not found.");
            
            const fileData = fileDoc.data();
            console.log("Checkpoint 2: File data retrieved.");

            // 3. Import Sender Private Key
            const privKeyRaw = localStorage.getItem("privateKey");
            if (!privKeyRaw) throw new Error("Your private key is missing from this browser.");

            const cleanPriv = privKeyRaw.replace(/-----BEGIN.*?-----|-----END.*?-----|\s/g, "");
            const senderPrivateKey = await crypto.subtle.importKey(
                "pkcs8",
                Uint8Array.from(atob(cleanPriv), c => c.charCodeAt(0)),
                { name: "RSA-OAEP", hash: "SHA-256" },
                true,
                ["decrypt"]
            );
            console.log("Checkpoint 3: Sender private key imported.");

            // 4. Decrypt the Master AES Key
            let rawAesKey;
            if (fileData.encryptedKey) {
                try {
                    const encryptedAesBuffer = Uint8Array.from(atob(fileData.encryptedKey), c => c.charCodeAt(0));
                    rawAesKey = await crypto.subtle.decrypt(
                        { name: "RSA-OAEP" }, 
                        senderPrivateKey, 
                        encryptedAesBuffer
                    );
                    console.log("Checkpoint 4: AES Key decrypted successfully.");
                } catch (decErr) {
                    throw new Error("Decryption failed. Ensure you are on the same device used for upload.");
                }
            } else {
                throw new Error("This file is missing an encrypted master key.");
            }

            // 5. Import Recipient Public Key
            const recipientPublicKey = await importPublicKey(recipientPublicKeyBase64);

            // 6. Re-encrypt the AES Key for the Recipient
            const encryptedKeyBuffer = await crypto.subtle.encrypt(
                { name: "RSA-OAEP" }, 
                recipientPublicKey,
                rawAesKey
            );
            const encryptedKeyForRecipient = btoa(String.fromCharCode(...new Uint8Array(encryptedKeyBuffer)));
            console.log("Checkpoint 6: Success!");

            // 7. Save to the Shares collection
            await db.collection("shares").add({
                fileId: fileId,
                fileName: fileName,
                storagePath: fileData.storagePath,
                iv: fileData.iv,
                fileHash: fileData.fileHash, 
                integrityStatus: fileData.integrityStatus || "VERIFIED",
                from: sender.uid,
                senderEmail: sender.email,
                to: recipientUid,
                recipientEmail: recipientEmail,
                encryptedKey: encryptedKeyForRecipient,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            // 8. Forensic Log
            await logForensicEvent("FILE_SHARE", {
                fileName: fileName,
                sharedWith: recipientEmail
            });

            showMessage("File shared securely 🔐");

        } catch (error) {
            console.error("FAILED AT:", error.message);
            showMessage("Sharing failed: " + error.message, "error");
        }
    }

      async function downloadSharedFile(shareId) {
        try {
            showMessage("Initializing secure download...", "success");

            // 1. Fetch Share metadata
            const shareDoc = await db.collection("shares").doc(shareId).get();
            if (!shareDoc.exists) throw new Error("Share record not found.");
            const shareData = shareDoc.data();

            // 2. Fetch File metadata
            const fileDoc = await db.collection("files").doc(shareData.fileId).get();
            if (!fileDoc.exists) throw new Error("Original file metadata missing.");
            const fileData = fileDoc.data();

            showMessage("Downloading encrypted data...");

            // 3. Download encrypted file from Storage
            const fileRef = storage.ref(fileData.storagePath);
            const url = await fileRef.getDownloadURL();
            const response = await fetch(url);
            const encryptedBuffer = await response.arrayBuffer();

            // 4. Import Private Key from LocalStorage
            const privateKeyBase64 = localStorage.getItem("privateKey");
            if (!privateKeyBase64) throw new Error("Private key not found on this device.");

            // Clean key string of any hidden characters or headers
            const cleanPrivKey = privateKeyBase64.replace(/-----BEGIN.*?-----|-----END.*?-----|\s/g, "");
            
            const privateKey = await crypto.subtle.importKey(
                "pkcs8",
                Uint8Array.from(atob(cleanPrivKey), c => c.charCodeAt(0)),
                { name: "RSA-OAEP", hash: "SHA-256" },
                true,
                ["decrypt"]
            );

            // 5. Decrypt the AES key using RSA
            showMessage("Decrypting security keys...");

            try {
                // 1. Clean the Base64 string
                const cleanEncryptedKey = shareData.encryptedKey.replace(/\s/g, '');
                const encryptedKeyBuffer = Uint8Array.from(atob(cleanEncryptedKey), c => c.charCodeAt(0));

                // 2. Perform the Decryption
                const rawAESKey = await crypto.subtle.decrypt(
                    { name: "RSA-OAEP" },
                    privateKey, 
                    encryptedKeyBuffer
                );

                // 3. Import the decrypted AES key for file decryption
                const aesKey = await crypto.subtle.importKey(
                    "raw",
                    rawAESKey,
                    { name: "AES-GCM" },
                    false,
                    ["decrypt"]
                );

                console.log("AES Key successfully recovered.");
                
                // --- Proceed to Step 6: Decrypt the File ---
                const iv = new Uint8Array(JSON.parse(fileData.iv));
                const decrypted = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    aesKey,
                    encryptedBuffer
                );

                // 7. Trigger the Browser Download
                const blob = new Blob([decrypted]);
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = shareData.fileName.replace(".enc", ""); 
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                showMessage("File decrypted and saved successfully!", "success");

            } catch (err) {
                // This is the 'catch' the browser was looking for!
                console.error("Decryption Error Details:", err);
                throw new Error("Decryption failed. This usually happens if your RSA keys don't match the ones used to share the file.");
            }

            // 8. Forensic Log (Optional but recommended)
            await logForensicEvent("SHARED_FILE_DECRYPT_SUCCESS", {
                fileName: shareData.fileName,
                shareId: shareId
            });

        } catch (error) {
            console.error("Download/Decrypt Error:", error);
            showMessage("Decryption failed: " + error.message, "error");
            
            await logForensicEvent("SHARED_FILE_DECRYPT_FAILURE", {
                shareId: shareId,
                error: error.message
            });
        }
    }

    async function logForensicEvent(action, details = {}) {
        const user = auth.currentUser;
        
        const logData = {
            // Fallback for unauthenticated attempts
            userId: user ? user.uid : "unauthenticated",
            userEmail: user ? user.email : (details.email || "unknown"),
            action: action,
            details: details,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("logs").add(logData);
            console.log(`[FORENSIC] ${action} captured.`);
        } catch (error) {
            console.error("Forensic logging failed:", error);
        }
    }

      async function showLogs() {
        switchView('logSection'); 

        const logList = document.getElementById("logList");
        logList.innerHTML = '<div class="no-files">Retrieving security records...</div>';

        try {
            const user = auth.currentUser;
            if (!user) return;

            const snapshot = await db.collection("logs")
                .where("userEmail", "==", user.email) 
                .orderBy("timestamp", "desc")
                .limit(30)
                .get();

            logList.innerHTML = "";
            
            if (snapshot.empty) {
                logList.innerHTML = '<div class="no-files">No activity recorded yet.</div>';
                return;
            }

            let lastDateLabel = "";

            snapshot.forEach(doc => {
                const log = doc.data();
                if (!log.timestamp) return;

                const logDate = log.timestamp.toDate();
                const dateLabel = getFriendlyDate(logDate); 

                // Grouping Header (Today, Yesterday, etc.)
                if (dateLabel !== lastDateLabel) {
                    const header = document.createElement("div");
                    header.style = "margin: 20px 0 10px 5px; font-size: 12px; font-weight: bold; color: var(--primary); text-transform: uppercase; letter-spacing: 1px;";
                    header.innerHTML = dateLabel;
                    logList.appendChild(header);
                    lastDateLabel = dateLabel;
                }

                // COLOR LOGIC: Red for failures/errors, Black for success
                const isFailure = log.action.includes("FAILURE") || log.action.includes("ERROR");
                const statusColor = isFailure ? "#ff4d4d" : "#1a1a1a";
                
                const logItem = document.createElement("div");
                logItem.className = "log-item";
                logItem.style = `
                    background: var(--card-bg); 
                    padding: 15px; 
                    margin-bottom: 8px;
                    border-radius: 10px; 
                    border: 1px solid var(--border-color);
                    border-left: 5px solid ${statusColor};
                    display: flex; 
                    justify-content: space-between; 
                    align-items: center;
                `;
                
                let detailText = "";
                if (log.details && typeof log.details === 'object') {
                    detailText = Object.entries(log.details)
                        .map(([k, v]) => `<span style="color:var(--text-sub)">${k}:</span> ${v}`)
                        .join(' | ');
                } else {
                    detailText = log.details || "No additional details";
                }

                // DATE & TIME FORMATTING
                const timeString = logDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const day = String(logDate.getDate()).padStart(2, '0');
                const month = String(logDate.getMonth() + 1).padStart(2, '0');
                const year = logDate.getFullYear();
                const fullDateString = `${day}/${month}/${year}`;

                logItem.innerHTML = `
                    <div style="flex: 1; padding-right: 15px;">
                        <strong style="color:${statusColor}; text-transform: uppercase; font-size: 14px; letter-spacing: 0.5px;">${log.action}</strong>
                        <div style="font-size: 13px; color: var(--text-main); margin-top: 4px; word-break: break-word;">${detailText}</div>
                    </div>
                    <div style="font-size: 12px; color: var(--text-main); white-space: nowrap; text-align: right; font-weight: bold;">
                        <div>${fullDateString}</div>
                        <div>${timeString}</div>
                    </div>
                `;
                logList.appendChild(logItem);
            });
        } catch (error) {
            console.error("Error fetching logs:", error);
            logList.innerHTML = `<div class="no-files" style="color:#ff4d4d;">Permission Denied or Index missing.</div>`;
        }
    }

    // Helper for date headers
    function getFriendlyDate(date) {
        const today = new Date();
        const yesterday = new Date();
        yesterday.setDate(today.getDate() - 1);

        if (date.toDateString() === today.toDateString()) return "Today";
        if (date.toDateString() === yesterday.toDateString()) return "Yesterday";
        return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    
    function getFriendlyDate(date) {
        const today = new Date();
        const yesterday = new Date();
        yesterday.setDate(today.getDate() - 1);

        if (date.toDateString() === today.toDateString()) {
            return "Today";
        } else if (date.toDateString() === yesterday.toDateString()) {
            return "Yesterday";
        } else {
            // Returns "Feb 12, 2026"
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }
    }

    function switchView(viewId) {
      // 1. Hide every possible section first
      const sections = ['uploadSection', 'sharedSection', 'settingsSection', 'logSection'];
      sections.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
      });

      // 2. Show only the one the user clicked
      const target = document.getElementById(viewId);
      if (target) target.style.display = 'block';

      // 3. Update the Sidebar Highlights
      document.querySelectorAll('.nav-menu button, .sidebar-footer button').forEach(btn => {
        btn.classList.remove('active');
      });
    }

    async function importPrivateKey(privateKeyBase64) {
      const binary = Uint8Array.from(atob(privateKeyBase64), c => c.charCodeAt(0));

      return await crypto.subtle.importKey(
        "pkcs8",
        binary.buffer,
        { name: "RSA-OAEP", hash: "SHA-256" },
        true,
        ["decrypt"]
      );
    }

    async function decryptAESKeyWithRSA(encryptedKeyBase64, privateKey) {
      const encryptedBytes = Uint8Array.from(atob(encryptedKeyBase64), c => c.charCodeAt(0));

      const decrypted = await crypto.subtle.decrypt(
        { name: "RSA-OAEP" },
        privateKey,
        encryptedBytes
      );

      return decrypted;
    }

    async function downloadAndDecryptFile(storagePath, fileName) {
      try {
        const user = auth.currentUser;

        // Get file metadata from Firestore
        const snapshot = await db.collection("files")
          .where("storagePath", "==", storagePath)
          .where("ownerId", "==", user.uid)
          .get();

        if (snapshot.empty) {
          showMessage("File record not found.", "error");
          return;
        }

        const fileData = snapshot.docs[0].data();
        const iv = new Uint8Array(JSON.parse(fileData.iv));
        const encryptedKeyBase64 = fileData.encryptedKey;

        // Get encrypted file from Firebase Storage
        const fileRef = storage.ref(storagePath);
        const downloadURL = await fileRef.getDownloadURL();
        const response = await fetch(downloadURL);
        const encryptedBuffer = await response.arrayBuffer();

        // Load private RSA key from localStorage
        const privateKeyBase64 = localStorage.getItem("privateKey");
        if (!privateKeyBase64) {
          showMessage("Private key missing.", "error");
          return;
        }

        const privateKey = await importPrivateKey(privateKeyBase64);

        // Decrypt AES key
        const decryptedAESKeyBuffer = await decryptAESKeyWithRSA(
          encryptedKeyBase64,
          privateKey
        );

        // Import AES key
        const aesKey = await crypto.subtle.importKey(
          "raw",
          decryptedAESKeyBuffer,
          { name: "AES-GCM" },
          false,
          ["decrypt"]
        );

        // Decrypt file
        const decryptedBuffer = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          aesKey,
          encryptedBuffer
        );

        // Create file and download
        const blob = new Blob([decryptedBuffer]);
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        showMessage("File decrypted successfully!");

      } catch (error) {
        showMessage("Decryption failed: " + error.message, "error");
      }
    }

    async function syncKeys() {
        try {
            const user = auth.currentUser;
            if (!user) {
                console.error("No user logged in!");
                return;
            }
            
            const pubKey = localStorage.getItem("publicKey");
            if (pubKey) {
                await db.collection("users").doc(user.uid).update({

        }
    }

    async function deleteSharedRecord(shareId, fileName) {

    async function downloadFile(fileId) {
    try {
        showMessage("Accessing vault...", "success");

        // 1. DUAL COLLECTION SEARCH (Fixes the Shared Download Error)
        let fileDoc = await db.collection("files").doc(fileId).get();
        let collectionName = "files";

        if (!fileDoc.exists) {
            fileDoc = await db.collection("shares").doc(fileId).get();
            collectionName = "shares";
        }

        if (!fileDoc.exists) throw new Error("File metadata not found in database.");
        const fileData = fileDoc.data();

        // 2. Import Private Key from LocalStorage
        const privateKeyBase64 = localStorage.getItem("privateKey");
        if (!privateKeyBase64) throw new Error("Private key missing on this device.");

        const cleanPrivKey = privateKeyBase64.replace(/-----BEGIN.*?-----|-----END.*?-----|\s/g, "");
        
        const privateKey = await window.crypto.subtle.importKey(
            "pkcs8",
            Uint8Array.from(atob(cleanPrivKey), c => c.charCodeAt(0)),
            { name: "RSA-OAEP", hash: "SHA-256" },
            true,
            ["decrypt"]
        );

        // 3. Decrypt the AES key
        if (!fileData.encryptedKey) throw new Error("Encrypted key is missing from metadata.");
        
        // Robust Base64 to Uint8Array conversion
        const binaryString = atob(fileData.encryptedKey);
        const encryptedKeyBuffer = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            encryptedKeyBuffer[i] = binaryString.charCodeAt(i);
        }

        let rawAESKey;
        try {
            rawAESKey = await window.crypto.subtle.decrypt(
                { name: "RSA-OAEP" },
                privateKey,
                encryptedKeyBuffer
            );
        } catch (rsaErr) {
            console.error("RSA Unwrap Error:", rsaErr);
            throw new Error("RSA decryption failed. This key pair cannot unlock this file.");
        }

        const aesKey = await window.crypto.subtle.importKey(
            "raw",
            rawAESKey,
            { name: "AES-GCM" },
            false,
            ["decrypt"]
        );

        // 4. Fetch the encrypted file from Storage
        showMessage("Downloading and decrypting...");
        const fileRef = storage.ref(fileData.storagePath);
        const url = await fileRef.getDownloadURL();
        const response = await fetch(url);
        const encryptedBuffer = await response.arrayBuffer();

        // 5. AES Decryption (Handles both Array and String IV formats)
        let ivUint8;
        if (typeof fileData.iv === 'string') {
            try {
                // Try JSON parse if it looks like an array string, otherwise treat as Base64
                ivUint8 = fileData.iv.startsWith('[') 
                    ? new Uint8Array(JSON.parse(fileData.iv)) 
                    : Uint8Array.from(atob(fileData.iv), c => c.charCodeAt(0));
            } catch(e) {
                ivUint8 = Uint8Array.from(atob(fileData.iv), c => c.charCodeAt(0));
            }
        } else {
            ivUint8 = new Uint8Array(fileData.iv);
        }

        let decryptedBuffer;
        try {
            decryptedBuffer = await window.crypto.subtle.decrypt(
                { name: "AES-GCM", iv: ivUint8 },
                aesKey,
                encryptedBuffer
            );
        } catch (decErr) {
            console.error("AES Decryption Detail:", decErr);
            throw new Error("AES decryption failed. Metadata mismatch.");
        }

        // --- FORENSIC INTEGRITY VERIFICATION ---
        showMessage("Verifying file integrity...");
        const currentHash = await generateFileHash(decryptedBuffer);
        
        if (currentHash !== fileData.fileHash) {
            // 🚨 INTEGRITY BREACH DETECTED - Update the correct collection
            await db.collection(collectionName).doc(fileId).update({
                integrityStatus: "FAILED"
            });
            
            if (typeof loadFiles === 'function') loadFiles();
            if (typeof loadSharedFiles === 'function') loadSharedFiles();
            throw new Error("Forensic Integrity Failure! Hash mismatch detected.");
        }

        // 6. Save to computer
        const blob = new Blob([decryptedBuffer]);
        const a = document.createElement("a");
        const downloadUrl = URL.createObjectURL(blob);
        a.href = downloadUrl;
        a.download = fileData.fileName.replace(".enc", "");
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(downloadUrl);

        showMessage("Integrity Verified & Downloaded! ✅", "success");

        // Forensic Log
        const logType = collectionName === "shares" ? "SHARED_FILE_DOWNLOAD" : "OWNER_FILE_DOWNLOAD";
        await logForensicEvent(logType, { 
            fileName: fileData.fileName,
            integrity: "VERIFIED",
            fileId: fileId
        });

    } catch (error) {
        console.error("Vault Download Error Detail:", error);
        showMessage(error.message, "error");
    }
}

async function backupPrivateKeyToCloud(privateKeyBase64, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const passwordKey = await deriveKeyFromPassword(password, salt);

    const encoder = new TextEncoder();
    const encryptedData = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        passwordKey,
        encoder.encode(privateKeyBase64)
    );

    const user = auth.currentUser;
    await db.collection("users").doc(user.uid).update({
        encryptedPrivKey: btoa(String.fromCharCode(...new Uint8Array(encryptedData))),
        salt: JSON.stringify(Array.from(salt)),
        iv_back: JSON.stringify(Array.from(iv))
    });
}

async function deriveKeyFromPassword(password, salt) {
    const encoder = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
        "raw", 
        encoder.encode(password), 
        "PBKDF2", 
        false, 
        ["deriveKey"]
    );

    return await crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: salt,
            iterations: 100000, // NIST standard for high security
            hash: "SHA-256"
        },
        baseKey,
        { name: "AES-GCM", length: 256 },
        true,
        ["encrypt", "decrypt"]
    );
}

    // Pulls the encrypted key from Firestore and decrypts it locally
    async function restorePrivateKeyFromCloud(password) {
        const user = auth.currentUser;
        const doc = await db.collection("users").doc(user.uid).get();
        const data = doc.data();

        if (!data.encryptedPrivKey) throw new Error("No cloud backup found.");

        const salt = new Uint8Array(JSON.parse(data.salt));
        const iv = new Uint8Array(JSON.parse(data.iv_back));
        const encryptedBuffer = Uint8Array.from(atob(data.encryptedPrivKey), c => c.charCodeAt(0));

        const passwordKey = await deriveKeyFromPassword(password, salt);

        try {
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv },
                passwordKey,
                encryptedBuffer
            );

            const privateKeyBase64 = new TextDecoder().decode(decrypted);
            localStorage.setItem("privateKey", privateKeyBase64);
            return true;
        } catch (err) {
            throw new Error("Wrong Master Password. Unable to unlock keys.");
        }
    }

    async function generateFileHash(buffer) {
    const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }
